name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Secrets and internal-identifier scan
        run: python tools/check_secrets.py
      - name: Key-shaped strings anywhere in the tree
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- . ':!tools/check_secrets.py'; then
            echo "A Google API key shape was found"; exit 1; fi
      - name: Generate Worker types (git-ignored, needed by astro check)
        run: npx wrangler types
      - run: npx astro check
      - run: npm run build
